<!DOCTYPE html>
<html lang="es">
<head>
    <!-- =================================================================== -->
    <!-- CONFIGURACIÓN BÁSICA Y METADATOS DEL DOCUMENTO                      -->
    <!-- =================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMSS-BIENESTAR - HOSPITAL GENERAL DE HUIMANGUILLO | Inicio de Sesión</title>

    <!-- Librería de Iconos FontAwesome (Carga CDN para iconos de alta visibilidad) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- =================================================================== -->
    <!-- ESTILOS CSS (HOJA DE ESTILOS INTEGRADA)                            -->
    <!-- =================================================================== -->
    <style>
        /* ----------------------------------------------------------------- */
        /* 1. PALETA DE COLORES INSTITUCIONALES (VARIABLES GLOBALES)         */
        /* ----------------------------------------------------------------- */
        :root {
            --imss-verde: #006847;        /* Verde principal de la identidad visual */
            --imss-verde-oscuro: #004d34; /* Verde para estados :hover en botones */
            --imss-dorado: #9f2241;       /* Tono guinda/dorado de acento */
            --imss-gris-fondo: #f4f6f8;   /* Gris claro para fondo general de pantalla */
            --texto-oscuro: #1c252e;      /* Color para alta legibilidad de etiquetas */
        }

        /* ----------------------------------------------------------------- */
        /* 2. ESTILOS GENERALES DEL BODY Y CENTRADO DE PANTALLA              */
        /* ----------------------------------------------------------------- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--imss-gris-fondo);
            display: flex;
            justify-content: center; /* Centrado horizontal del cuadro de login */
            align-items: center;     /* Centrado vertical del cuadro de login */
            min-height: 100vh;
        }

        /* ----------------------------------------------------------------- */
        /* 3. TARJETA CONTENEDORA DEL FORMULARIO (LOGIN CARD)                */
        /* ----------------------------------------------------------------- */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;       /* Ancho adecuado para pantallas y tablets */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Sombra suave para elevación */
            border-top: 8px solid var(--imss-verde);     /* Banda verde superior */
        }

        /* ----------------------------------------------------------------- */
        /* 4. ENCABEZADO Y LOGOTIPO                                          */
        /* ----------------------------------------------------------------- */
        .header-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Estilo para ajustar el logotipo institucional */
        .header-logo img.hospital-logo {
            max-height: 70px;       /* Controla la altura máxima para que luzca estético */
            width: auto;            /* Mantiene la proporción original de la imagen */
            margin-bottom: 10px;
            object-fit: contain;
        }

        .header-logo h1 {
            color: var(--imss-verde);
            font-size: 24px;
            margin: 5px 0;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header-logo p {
            color: #637381;
            font-size: 15px;
            margin: 0;
        }

        /* ----------------------------------------------------------------- */
        /* 5. CAMPOS DEL FORMULARIO Y ESTRUCTURA DE ENTRADAS                */
        /* ----------------------------------------------------------------- */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: var(--texto-oscuro);
            margin-bottom: 8px;
        }

        /* Contenedor relativo para alinear iconos dentro de los inputs */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Icono decorativo de la izquierda (Usuario / Candado) */
        .input-wrapper i.field-icon {
            position: absolute;
            left: 14px;
            color: #919eab;
            font-size: 18px;
        }

        /* Caja de texto estándar para las entradas */
        .form-control {
            width: 100%;
            padding: 14px 45px 14px 42px; /* Margen interno para no tapar los iconos */
            font-size: 18px;
            border: 2px solid #dfe3e8;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        /* Resaltado cuando el usuario hace clic o escribe en el campo */
        .form-control:focus {
            border-color: var(--imss-verde);
        }

        /* ----------------------------------------------------------------- */
        /* 6. BOTÓN INTERACTIVO PARA MOSTRAR / OCULTAR CONTRASEÑA           */
        /* ----------------------------------------------------------------- */
        .toggle-password {
            position: absolute;
            right: 14px;
            cursor: pointer;
            color: #637381;
            font-size: 20px;
            padding: 5px;
            user-select: none;
        }

        .toggle-password:hover {
            color: var(--imss-verde);
        }

        /* ----------------------------------------------------------------- */
        /* 7. BOTÓN PRINCIPAL DE INICIO DE SESIÓN                           */
        /* ----------------------------------------------------------------- */
        .btn-primary {
            width: 100%;
            background-color: var(--imss-verde);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--imss-verde-oscuro);
        }
    </style>
</head>
<body>

    <!-- =================================================================== -->
    <!-- ESTRUCTURA PRINCIPAL DE LA INTERFAZ                                 -->
    <!-- =================================================================== -->
    <div class="login-card">

        <!-- Sección: Encabezado con Logotipo Institucional -->
        <div class="header-logo">
            <!-- Logotipo ubicado en la raíz del servidor -->
            <img src="logo_hospital.png" alt="Logo Hospital General de Huimanguillo" class="hospital-logo" onerror="this.style.display='none'">
            
            <p>Sistema Integral de Citas y Expedientes</p>
        </div>

        <!-- =============================================================== -->
        <!-- FORMULARIO DE ACCESO CONECTADO A BACKEND (login.php)           -->
        <!-- =============================================================== -->
        <form action="login.php" method="POST">
            
            <!-- Campo 1: Usuario / Matrícula -->
            <div class="form-group">
                <label for="username">Usuario / Matrícula</label>
                <div class="input-wrapper">
                    <!-- Icono visual izquierdo -->
                    <i class="fa-solid fa-user field-icon"></i>
                    <!-- Input de entrada -->
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingrese su usuario" required autocomplete="username">
                </div>
            </div>

            <!-- Campo 2: Contraseña con Ojo Interactivo -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <!-- Icono visual izquierdo -->
                    <i class="fa-solid fa-lock field-icon"></i>
                    <!-- Input de entrada -->
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <!-- Icono interactivo para mostrar/ocultar texto de contraseña -->
                    <i class="fa-solid fa-eye toggle-password" id="togglePasswordIcon" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')" title="Mostrar / Ocultar contraseña"></i>
                </div>
            </div>

            <!-- Botón de Envío de Formulario -->
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </button>
        </form>

    </div>

    <!-- =================================================================== -->
    <!-- LÓGICA EN JAVASCRIPT (LADO DEL CLIENTE)                             -->
    <!-- =================================================================== -->
    <script>
        /**
         * Alterna el estado del campo de contraseña entre texto legible y oculto (puntos).
         * @param {string} inputId - El ID del elemento <input> de la contraseña.
         * @param {string} iconId  - El ID del elemento <i> del icono del ojo.
         */
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
